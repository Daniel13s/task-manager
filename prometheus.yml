global:
  scrape_interval: 5s # Tempo entre cada coleta (5s é ótimo para testes de carga)
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'nodejs_api'
    metrics_path: '/metrics'
    static_configs:
      # 'host.docker.internal' é o segredo: ele aponta para o seu Windows
      # mesmo de dentro do container Linux do Docker.
      - targets: ['host.docker.internal:3000'] 
    
    # Se você estiver usando PM2 com várias instâncias na mesma porta, 
    # o Prometheus verá o balanço de carga do PM2 como um único alvo.